name: Dependency security

on:
  pull_request:
    paths:
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/package*.json
      - .github/workflows/security.yml
  push:
    branches: [main, master]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.10.0'
      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Export locked backend inventory
        if: always()
        working-directory: backend
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
      - name: Backend audit (known unresolved advisories are not suppressed)
        if: always()
        working-directory: backend
        run: uvx pip-audit --disable-pip --require-hashes -r requirements-audit.txt --format json --output pip-audit.json
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-security-reports
          path: |
            frontend/npm-audit.json
            backend/pip-audit.json
            backend/requirements-audit.txt
          retention-days: 30
