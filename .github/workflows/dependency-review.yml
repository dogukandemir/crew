name: Dependency review

# Blocks a pull request that introduces a dependency with a high or critical
# advisory, before the lockfile reaches main. The weekly Dependency security
# workflow is the slower backstop that scans the resolved tree.
#
# Dependency review needs GitHub Advanced Security on private repositories and is
# free on public ones, so the job is gated on visibility.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
