[project]
name = "crew-backend"
version = "0.1.0"
description = "Crew control room backend, the FastAPI/event-sourced engine behind a local-first CrewAI agent company."
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "crewai[anthropic]>=1.15.27",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Repository = "https://github.com/dogukandemir/crew"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["live: hits a real model provider (excluded by default)"]
addopts = "-m 'not live' -q"

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = [
    "E501",
    # FastAPI's dependency-injection idiom is a function call in a default argument.
    "B008",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-gremlins>=1.11.4",
    "ruff>=0.17.0",
]

[tool.pytest-gremlins]
# Mutation testing (docs/13). Default scope: the security spine: the modules where a
# wrong answer costs the most. CLI --gremlin-targets overrides this per run; keep the
# pytest file selection tight (only the tests covering the target) so each mutant's
# run stays fast. Note: the incremental cache keys on SOURCE, not tests: after
# editing tests, re-run with --gremlin-clear-cache or you will read stale verdicts.
paths = [
    "src/crew/control/security_review.py",
    "src/crew/control/workspaces.py",
    "src/crew/core/security.py",
]
workers = 8

