version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
    ignore:
      # Base images track the tested toolchain, not the newest tag: the pinned CrewAI caps
      # Python below 3.14, and the frontend stays on the stable nginx branch (1.31 is
      # mainline). Both are recorded in docs/DEPENDENCIES.md.
      - dependency-name: python
        versions: [">=3.14"]
      - dependency-name: nginx
        versions: [">=1.31"]
