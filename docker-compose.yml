# Local single-workspace distribution. Ports are intentionally loopback-only.
# The sandbox broker owns Docker access; the API never mounts the daemon socket.
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      CREW_OFFLINE_LLM: ${CREW_OFFLINE_LLM:-true}
      CREW_ENV: prod
      CREW_CONTAINER_LOCAL_AUTH: "true"
      CREW_WORKSPACE_ROOT: /workspaces
      CREW_SANDBOX_URL: http://sandbox:8790
      CREW_SANDBOX_TOKEN_FILE: /sandbox-auth/token
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - crew-data:/data
      - crew-workspaces:/workspaces
      - sandbox-auth:/sandbox-auth:ro
    networks: [default, sandbox-private]
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8787,timeout=3); c.request('GET','/api/health'); assert c.getresponse().status in (200,401,403)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  sandbox:
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox
    environment:
      CREW_WORKSPACE_VOLUME: ${COMPOSE_PROJECT_NAME:-crew}-workspaces
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - crew-workspaces:/workspaces
      - sandbox-auth:/sandbox-auth
    networks: [sandbox-private]
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,urllib.request; r=urllib.request.Request('http://127.0.0.1:8790/health',headers={'Authorization':'Bearer '+pathlib.Path('/sandbox-auth/token').read_text().strip()}); urllib.request.urlopen(r,timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:8787}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mock:
    image: node:26-slim
    working_dir: /app
    volumes: [./dev/mock:/app:ro]
    command: ["node", "server.mjs"]
    ports: ["127.0.0.1:8788:8788"]
    profiles: [mock]

volumes:
  crew-data:
  crew-workspaces:
    name: ${COMPOSE_PROJECT_NAME:-crew}-workspaces
  sandbox-auth:

networks:
  sandbox-private:
    internal: true
