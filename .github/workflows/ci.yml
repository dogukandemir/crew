name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend — tsc, tests, build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  backend:
    name: backend — ruff, pytest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major tags after v5 (only exact x.y.z since
      # v6) — `@v10` does not resolve on a runner. Pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check .
      - run: uv run pytest

  containers:
    name: Compose build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Check API and frontend
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:8787/api/health
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:5173/
          docker compose exec -T backend python -m crew doctor
      - name: Check sandbox tools and persistent storage
        run: |
          docker compose exec -T backend python - < backend/tests/docker/smoke.py
          docker compose up -d --force-recreate --wait --wait-timeout 180
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:8787/api/health
          docker compose exec -T backend python - --verify-persistence < backend/tests/docker/smoke.py
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Stop CI installation
        if: always()
        run: docker compose down --volumes

# The live-marked tests hit a real model provider and stay excluded by default
# (backend/pyproject.toml: addopts = "-m 'not live'"), which is exactly what makes the
# rest of the suite safe to run on every push.
