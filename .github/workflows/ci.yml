name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: frontend — tsc, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  backend:
    name: backend — ruff, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

# The live-marked tests hit a real model provider and stay excluded by default
# (backend/pyproject.toml: addopts = "-m 'not live'"), which is exactly what makes the
# rest of the suite safe to run on every push.
