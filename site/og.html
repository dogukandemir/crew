<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Crew card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0b0e14; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #eef2f8;
    position: relative;
  }
  .bg { position: absolute; inset: 0; background:
    radial-gradient(72% 62% at 84% 12%, rgba(52, 211, 153, 0.16), transparent 64%),
    radial-gradient(55% 50% at 6% 98%, rgba(94, 116, 210, 0.12), transparent 60%),
    #0b0e14; }
  /* Two columns centred on one axis: the words left, the product right. Everything is
     sized in viewport units so the 1280x640 card and the 1200x630 card come out of the
     same file with the same proportions and no dead middle. */
  .wrap {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 47%;
    align-items: center;
    gap: 3.2vw;
    padding: 4.6% 5.5%;
  }
  .lede { display: flex; flex-direction: column; gap: 2.4vh; }
  .brand { display: flex; align-items: center; gap: 0.8vw; }
  .mark { width: 4.5vw; height: 4.5vw; border-radius: 1vw;
          box-shadow: 0 0 0 1px rgba(148,163,184,0.3); }
  h1 { font-size: 4.9vw; letter-spacing: -0.02em; line-height: 1; }
  .sub { font-size: 1.82vw; line-height: 1.42; color: #c3ccd9; max-width: 34ch; }
  .foot { display: flex; gap: 0.7vw; align-items: center; flex-wrap: wrap; }
  .pill { border: 1px solid rgba(148,163,184,0.32); border-radius: 999px;
          padding: 0.7vh 1.1vw; color: #c3ccd9; font-size: 1.24vw; }
  .where { color: #7d8798; font-size: 1.06vw; letter-spacing: 0.01em; }
  .shot { width: 100%; display: block; border-radius: 0.8vw;
          border: 1px solid rgba(148,163,184,0.3);
          box-shadow: 0 28px 56px rgba(0,0,0,0.55); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="lede">
      <div class="brand">
        <img class="mark" src="assets/icon-256.png" alt="">
        <h1>Crew</h1>
      </div>
      <p class="sub">A control room for a real AI agent company. Goals in, verified files and approvals out.</p>
      <div class="foot">
        <span class="pill">CrewAI execution</span>
        <span class="pill">Local-first</span>
        <span class="pill">MIT</span>
      </div>
      <div class="where">github.com/dogukandemir/crew</div>
    </div>
    <img class="shot" src="assets/office.png" alt="">
  </div>
</body>
</html>
