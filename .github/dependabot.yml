version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Two advisories cannot be fixed today and are documented as exceptions, with their
      # CVE IDs, in docs/DEPENDENCIES.md and enforced by a pin check in
      # .github/workflows/security.yml. Verified 17 October 2026: chromadb 1.5.9 is the
      # newest release on PyPI, so no fixed version exists for its four code-injection
      # advisories; and Dependabot's own resolution for mcp fails because crewai caps it
      # below 1.29 while the advisory range sits inside that cap. Remove the relevant ignore
      # the day a compatible fixed release exists, together with the CI exception.
      - dependency-name: chromadb
      - dependency-name: mcp
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
    ignore:
      # Base images track the tested toolchain, not the newest tag: the pinned CrewAI caps
      # Python below 3.14, and the frontend stays on the stable nginx branch (1.31 is
      # mainline). Both are recorded in docs/DEPENDENCIES.md.
      - dependency-name: python
        versions: [">=3.14"]
      - dependency-name: nginx
        versions: [">=1.31"]
