name: Dependency security

on:
  pull_request:
    paths:
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/package*.json
      - .github/workflows/security.yml
  push:
    branches: [main, master]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      # setup-uv stopped publishing floating major tags after v5 (only exact x.y.z since
      # v6), `@v10` does not resolve on a runner. The action is pinned by commit SHA;
      # the tool version it installs is pinned separately.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.9'
      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Export locked backend inventory
        if: always()
        working-directory: backend
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt
      # No advisory exceptions are applied. CrewAI 1.15.43 removed the chromadb
      # dependency and lifted its mcp cap to >=1.30.0, so the exported inventory no
      # longer contains either previously excepted package. The history and the
      # 19 November 2026 re-scan are recorded in docs/DEPENDENCIES.md; a new finding
      # fails this gate and is reviewed on its merits rather than ignored.
      - name: Backend audit, raw record (evidence; never fails the gate)
        if: always()
        continue-on-error: true
        working-directory: backend
        run: uvx pip-audit==2.10.1 --disable-pip --require-hashes -r requirements-audit.txt --format json --output pip-audit-raw.json
      - name: Backend audit (fails on any finding)
        if: always()
        working-directory: backend
        run: uvx pip-audit==2.10.1 --disable-pip --require-hashes -r requirements-audit.txt --format json --output pip-audit.json
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-security-reports
          path: |
            frontend/npm-audit.json
            backend/pip-audit.json
            backend/pip-audit-raw.json
            backend/requirements-audit.txt
          retention-days: 30
