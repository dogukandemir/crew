name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend, tsc, tests, build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  backend:
    name: backend, ruff, pytest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # setup-uv stopped publishing floating major tags after v5 (only exact x.y.z since
      # v6), `@v10` does not resolve on a runner. Pin the exact release.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check .
      - run: uv run pytest

  containers:
    name: Compose build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Match the sandbox broker to this host's Docker socket group
        # The broker runs non-root (uid 10001) and the daemon socket is root-owned,
        # so it joins the socket's group. On the runner the group is read from the
        # socket itself; on a developer host 999 is the usual Linux value and
        # Docker Desktop exposes the socket world-writable.
        run: echo "DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - name: Render the production compose file
        # The prod file is what a host runs. Prove it interpolates and that every
        # ${VAR:?} reference is satisfiable before anyone deploys it.
        run: |
          CREW_JWT_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(48))") \
          CREW_CORS_ORIGINS=https://crew.example.com \
          CREW_PUBLIC_ORIGIN=https://crew.example.com \
          docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Check API and frontend
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:8787/api/health
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:5173/
          docker compose exec -T backend python -m crew doctor
      - name: Check sandbox tools and persistent storage
        run: |
          docker compose exec -T backend python - < backend/tests/docker/smoke.py
          docker compose up -d --force-recreate --wait --wait-timeout 180
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:8787/api/health
          docker compose exec -T backend python - --verify-persistence < backend/tests/docker/smoke.py
      - name: Collect container logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Stop CI installation
        if: always()
        run: docker compose down --volumes

  workflows:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint workflow files
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse shell scripts
        run: bash -n scripts/backup.sh scripts/restore.sh deploy/vps/install.sh deploy/digitalocean/create-droplet.sh
      - name: Lint shell scripts
        # shellcheck 0.10.0, pinned by the image digest.
        run: |
          docker run --rm -v "$PWD:/mnt:ro" \
            koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            scripts/backup.sh scripts/restore.sh deploy/vps/install.sh deploy/digitalocean/create-droplet.sh

# The live-marked tests hit a real model provider and stay excluded by default
# (backend/pyproject.toml: addopts = "-m 'not live'"), which is exactly what makes the
# rest of the suite safe to run on every push.
