# Two commands to a running control room:  docker compose up
#
#   backend   the API + orchestrator on http://127.0.0.1:8787
#   frontend  the control room on http://localhost:5173
#
# It boots with no provider keys at all: CREW_OFFLINE_LLM defaults to true here, which is
# the deterministic fake runner — the same pipeline, zero spend. Put real keys in a .env
# or pass them in the environment to override it.
#
# The zero-key API mock is here too, behind a profile, for looking at the UI alone:
#   docker compose --profile mock up mock
services:
  backend:
    build: ./backend
    ports:
      - "8787:8787"
    environment:
      CREW_OFFLINE_LLM: ${CREW_OFFLINE_LLM:-true}
      CREW_ENV: ${CREW_ENV:-dev}
    volumes:
      - crew-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Read by the browser, so it has to be the host's address. Point it at 8788 and the
      # UI runs against the mock instead.
      VITE_API_BASE: ${VITE_API_BASE:-http://127.0.0.1:8787}
    depends_on:
      - backend
    restart: unless-stopped

  mock:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./dev/mock:/app:ro
    command: ["node", "server.mjs"]
    ports:
      - "8788:8788"
    profiles: ["mock"]

volumes:
  crew-data:
